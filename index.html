        /* About panel (hidden by default) */
        #about-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;               /* exactly 50% of viewport width */
            height: 100vh;             /* full height of screen */
            background: #fff;          /* fully opaque white */
            color: #000;               /* text color black */
            overflow-y: auto;
            transform: translateX(100%); /* hide offscreen initially */
            transition: transform 0.4s ease;
            padding: 40px;             /* inner padding */
            box-sizing: border-box;
            z-index: 1000;
        }

        /* Slide in when active */
        #about-panel.active {
            transform: translateX(0);
        }

        /* Close button */
        #close-about {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #000;
        }

        /* Improve text readability */

        #about-panel p {
            line-height: 1.6;
            margin-bottom: 1em;

        /* Mobile responsiveness: full width for small screens */

            }
